name: PublishDistribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the MSI asset to
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            "tag=${{ github.event.release.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Wix Toolset 4
        run: dotnet tool install --global wix --version 4.0.1

      - name: Restore NuGet packages
        run: dotnet restore src/Snap.Hutao/Snap.Hutao.slnx

      - name: Build WinUI 3 project
        run: dotnet build src/Snap.Hutao/Snap.Hutao/Snap.Hutao.csproj -c Release --no-restore

      - name: Build MSI installer
        run: dotnet build src/Snap.Hutao/Snap.Hutao.Installer/Snap.Hutao.Installer.wixproj -c Release --no-restore

      - name: Upload MSI to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = Get-ChildItem `
            -Path "src/Snap.Hutao/Snap.Hutao.Installer/bin/x64/Release/en-US" `
            -Filter "*.msi" `
            | Select-Object -First 1

          if ($null -eq $msi) {
            throw "MSI artifact was not found."
          }

          gh release upload "${{ steps.release.outputs.tag }}" $msi.FullName --repo "${{ github.repository }}" --clobber
